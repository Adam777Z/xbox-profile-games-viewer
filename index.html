<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Xbox Profile Games Viewer</title>
	<meta name="description" content="Xbox Profile Games Viewer">

	<link rel="stylesheet" href="./assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
	<link rel="stylesheet" href="./assets/css/style.css">

	<script src="./config.js"></script>
	<script src="./assets/js/bootstrap.bundle.min.js"></script>
	<script src="./assets/js/script.js" defer></script>
</head>
<body>
	<div class="container py-3">
		<div id="input-view">
			<div class="row mb-3">
				<div class="col">
					<h1>Xbox Profile Games Viewer</h1>
				</div>
			</div>

			<div class="row mb-3">
				<div class="col">
					<textarea id="json-input" class="form-control" rows="10" placeholder="Paste Xbox JSON here"></textarea>
				</div>
			</div>

			<div class="row">
				<div class="col">
					<button id="load-btn" class="btn btn-primary">Load games</button>
				</div>
			</div>

			<div class="row mt-3 d-none" id="error-box">
				<div class="col">
					<div class="alert alert-danger mb-0" id="error-text"></div>
				</div>
			</div>
		</div>

		<div id="games-view" class="d-none">
			<div class="row mb-3">
				<div class="col d-flex justify-content-between align-items-center">
					<h2 class="mb-0">Games</h2>
					<div class="btn-group">
						<button id="view-btn" class="btn btn-outline-primary btn-sm">Grid view</button>
						<button id="back-btn" class="btn btn-outline-secondary btn-sm">Back</button>
					</div>
				</div>
			</div>

			<div id="games-container" class="row row-cols-1 g-3"></div>
		</div>
	</div>
</body>
</html>
