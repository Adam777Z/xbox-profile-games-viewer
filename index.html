<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Xbox Profile Games Viewer</title>
	<meta name="description" content="Xbox Profile Games Viewer.">

	<link rel="stylesheet" href="./assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
	<link rel="stylesheet" href="./assets/css/style.min.css">

	<script src="./assets/js/script.min.js"></script>
</head>
<body>
	<div class="container py-3">

		<div class="row">
			<div class="col mx-auto">
				<div class="page-heading">
					<h1 class="text-center">Xbox Profile Games Viewer</h1>
					<button id="settings-toggle" class="btn btn-outline-secondary settings-toggle" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel" title="Settings">
						<i class="bi bi-gear-fill" aria-hidden="true"></i>
					</button>
				</div>
			</div>
		</div>

		<section id="settings-panel" class="settings-panel d-none" aria-label="Settings">
			<form id="settings-form">
				<div class="mb-3">
					<label for="proxy-url-input" class="form-label">Proxy URL</label>
					<input id="proxy-url-input" name="proxy_url" type="text" class="form-control" autocomplete="url" placeholder="https://" required>
				</div>
				<div class="mb-3">
					<label for="api-key-input" class="form-label">OpenXBL API key</label>
					<input id="api-key-input" name="api_key" type="password" class="form-control" autocomplete="off" required>
				</div>
				<div class="d-flex align-items-center gap-3">
					<button type="submit" class="btn btn-primary">Save settings</button>
					<span id="settings-status" class="small text-success" role="status" aria-live="polite"></span>
				</div>
			</form>
		</section>

		<form id="gamertag-loader" class="text-center my-3">
			<div class="gamertag-load-wrapper">
				<input id="gamertag-input" type="text" class="form-control" placeholder="Gamertag" autocomplete="off" required pattern=".*\S.*">
				<button id="load-btn" type="submit" class="btn btn-load">Load</button>
			</div>
		</form>

		<div id="error-box" class="alert alert-danger d-none" role="alert">
			<span id="error-text"></span>
		</div>

		<div id="games-section" class="my-3 d-none">
			<div class="text-center mb-2">
				<button id="reload-btn" class="btn btn-reload me-2">Reload</button>
				<button id="save-btn" class="btn btn-primary me-2">Save JSON file</button>
				<button id="view-btn" class="btn btn-secondary">Grid view</button>
			</div>

			<div id="games-container" class="row row-cols-1 g-3"></div>
		</div>

	</div>
</body>
</html>
