<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Xbox Profile Games Viewer</title>
	<meta name="description" content="Xbox Profile Games Viewer.">

	<link rel="stylesheet" href="./assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="./assets/css/bootstrap-icons.min.css">
	<link rel="stylesheet" href="./assets/css/style.min.css">

	<script src="./config.js"></script>
	<script src="./assets/js/script.min.js"></script>
</head>
<body>
	<div class="container py-3">

		<div class="row">
			<div class="col mx-auto">
				<h1 class="text-center">Xbox Profile Games Viewer</h1>
			</div>
		</div>

		<!-- Input view (visible on first load) -->
		<div id="input-view" class="text-center my-3">
			<button id="load-btn" class="btn btn-load me-2">Load</button>
		</div>

		<!-- Games view (hidden on first load) -->
		<div id="games-view" class="my-3 d-none">
			<div class="text-center mb-2">
				<button id="reload-btn" class="btn btn-reload me-2">Reload</button>
				<button id="view-btn" class="btn btn-secondary">Grid view</button>
			</div>

			<div id="error-box" class="alert alert-danger d-none" role="alert">
				<span id="error-text"></span>
			</div>

			<div id="games-container" class="row row-cols-1 g-3"></div>
		</div>

	</div>
</body>
</html>
